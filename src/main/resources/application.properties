# ===================================================================
# CONFIGURACIÓN DE APLICACIÓN Y PUERTO
# ===================================================================
spring.application.name=seguridad-web
server.port=8080

# ===================================================================
# CONEXIÓN A BASE DE DATOS MYSQL (seguridad_db)
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/seguridad_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# CONFIGURACIÓN JPA / HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# CONFIGURACIÓN DE PLANTILLAS THYMELEAF
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ===================================================================
# CONFIGURACIÓN DE LOGS PARA SPRING SECURITY
# ===================================================================
logging.level.org.springframework.security=DEBUG
logging.level.com.seguridadweb=DEBUG
