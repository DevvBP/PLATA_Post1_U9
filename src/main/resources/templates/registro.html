<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Seguridad Web</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="badge-tag">Nuevo Registro</span>
                <h1>Crear Cuenta</h1>
                <p>Laboratorio de Seguridad en Aplicaciones Web</p>
            </div>

            <!-- Error general si ocurre -->
            <div th:if="${errorGlobal}" class="alert alert-danger" id="alert-error-global">
                <span th:text="${errorGlobal}">Error al procesar el registro</span>
            </div>

            <!-- Formulario de Registro con validaciones Jakarta -->
            <form th:action="@{/registro}" th:object="${usuario}" method="post" id="registroForm">
                <div class="form-group">
                    <label class="form-label" for="nombre">Nombre Completo</label>
                    <input type="text" 
                           id="nombre" 
                           th:field="*{nombre}" 
                           class="form-control" 
                           placeholder="Juan Pérez" 
                           required>
                    <span class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Correo Electrónico</label>
                    <input type="email" 
                           id="email" 
                           th:field="*{email}" 
                           class="form-control" 
                           placeholder="tuemail@dominio.com" 
                           required>
                    <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="contrasenia">Contraseña (Mínimo 6 caracteres)</label>
                    <input type="password" 
                           id="contrasenia" 
                           th:field="*{contrasenia}" 
                           class="form-control" 
                           placeholder="••••••••" 
                           required>
                    <span class="field-error" th:if="${#fields.hasErrors('contrasenia')}" th:errors="*{contrasenia}"></span>
                </div>

                <button type="submit" class="btn btn-primary" id="btn-registrarse">
                    Registrar Cuenta
                </button>
            </form>

            <div class="auth-footer">
                <p>¿Ya tienes una cuenta registrada? <a th:href="@{/login}" id="link-login">Inicia sesión</a></p>
            </div>
        </div>
    </div>
</body>
</html>
